<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Customers - Dream's Cake</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      padding: 25px;
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 700;
      color: #ff758c;
      margin-bottom: 40px;
    }
    .sidebar-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-grow: 1;
    }
    .sidebar-menu a {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      color: #94a3b8;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    .sidebar-menu a:hover, .sidebar-menu a.active {
      background: rgba(214, 51, 132, 0.15);
      color: #ff758c;
    }

    /* Main Content */
    .main-content {
      flex-grow: 1;
      padding: 40px;
      overflow-y: auto;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .header-top h1 { font-size: 24px; font-weight: 700; }

    /* Form & Controls Container */
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 30px;
      backdrop-filter: blur(16px);
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }
    input {
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #f8fafc;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #ff758c; }
    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-primary { background: #ff758c; color: white; }
    .btn-primary:hover { background: #ff5270; }
    .btn-danger { background: rgba(248, 113, 113, 0.15); color: #f87171; }
    .btn-danger:hover { background: #f87171; color: white; }

    /* Table */
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 14px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); font-size: 14px; }
    th { color: #94a3b8; font-weight: 600; background: rgba(255, 255, 255, 0.02); }
    td { color: #e2e8f0; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-brand">
    <i class="fa-solid fa-cake-candles"></i> Dream's Cake
  </div>
  <ul class="sidebar-menu">
    <li><a href="index.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>
    <li><a href="products.html"><i class="fa-solid fa-birthday-cake"></i> Cakes / Products</a></li>
    <li><a href="orders.html"><i class="fa-solid fa-shopping-cart"></i> Orders</a></li>
    <li><a href="customers.html" class="active"><i class="fa-solid fa-users"></i> Customers</a></li>
    <li><a href="login.html" style="margin-top: auto; color: #f87171;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
  </ul>
</div>

<div class="main-content">
  <div class="header-top">
    <h1>Manage Customers</h1>
    <input type="text" id="search-box" placeholder="Search by name..." onkeyup="searchCustomers()" style="width: 250px;">
  </div>

  <!-- Customer Form -->
  <div class="card">
    <input type="hidden" id="customer-id">
    <div class="form-grid">
      <input type="text" id="name" placeholder="Customer Name">
      <input type="email" id="email" placeholder="Email Address">
      <input type="text" id="phone" placeholder="Phone Number">
      <input type="text" id="address" placeholder="Address">
    </div>
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-primary" onclick="saveOrUpdateCustomer()"><i class="fa-solid fa-save"></i> Save Customer</button>
      <button class="btn" style="background: rgba(255,255,255,0.08); color: white;" onclick="clearForm()">Clear</button>
    </div>
  </div>

  <!-- Customer Table -->
  <div class="card">
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Address</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody id="customer-table-body">
      <!-- Dynamic Data -->
      </tbody>
    </table>
  </div>
</div>

<script>
  const BASE_URL = "http://localhost:8080/v1/customers";

  // Load all customers on page load
  $(document).ready(function() {
    loadCustomers();
  });

  function loadCustomers() {
    $.ajax({
      url: BASE_URL,
      type: "GET",
      headers: { "Authorization": "Bearer " + localStorage.getItem("token") },
      success: function(response) {
        let rows = "";
        if (response && response.length > 0) {
          response.forEach(c => {
            rows += `<tr>
              <td>#${c.id}</td>
              <td>${c.name}</td>
              <td>${c.email}</td>
              <td>${c.phone}</td>
              <td>${c.address}</td>
              <td>
                <button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick="editCustomer(${c.id}, '${c.name}', '${c.email}', '${c.phone}', '${c.address}')">Edit</button>
                <button class="btn btn-danger" style="padding: 6px 12px; font-size: 12px;" onclick="deleteCustomer(${c.id})">Delete</button>
              </td>
            </tr>`;
          });
        } else {
          rows = `<tr><td colspan="6" style="text-align: center; color: #94a3b8;">No customers found.</td></tr>`;
        }
        $('#customer-table-body').html(rows);
      }
    });
  }

  function saveOrUpdateCustomer() {
    const id = $('#customer-id').val();
    const customerData = {
      name: $('#name').val(),
      email: $('#email').val(),
      phone: $('#phone').val(),
      address: $('#address').val()
    };

    let url = BASE_URL;
    let type = "POST";

    if (id) {
      customerData.id = parseInt(id);
      type = "PUT";
    }

    $.ajax({
      url: url,
      type: type,
      contentType: "application/json",
      data: JSON.stringify(customerData),
      headers: { "Authorization": "Bearer " + localStorage.getItem("token") },
      success: function() {
        alert(id ? "Customer Updated Successfully!" : "Customer Saved Successfully!");
        clearForm();
        loadCustomers();
      },
      error: function(err) {
        alert("Operation Failed!");
        console.error(err);
      }
    });
  }

  function editCustomer(id, name, email, phone, address) {
    $('#customer-id').val(id);
    $('#name').val(name);
    $('#email').val(email);
    $('#phone').val(phone);
    $('#address').val(address);
  }

  function deleteCustomer(id) {
    if (confirm("Are you sure you want to delete this customer?")) {
      $.ajax({
        url: BASE_URL + "/" + id,
        type: "DELETE",
        headers: { "Authorization": "Bearer " + localStorage.getItem("token") },
        success: function() {
          alert("Customer Deleted Successfully!");
          loadCustomers();
        }
      });
    }
  }

  function searchCustomers() {
    let query = $('#search-box').val();
    if (!query) {
      loadCustomers();
      return;
    }
    $.ajax({
      url: BASE_URL + "/search/" + query,
      type: "GET",
      headers: { "Authorization": "Bearer " + localStorage.getItem("token") },
      success: function(response) {
        let rows = "";
        if (response && response.length > 0) {
          response.forEach(c => {
            rows += `<tr>
              <td>#${c.id}</td>
              <td>${c.name}</td>
              <td>${c.email}</td>
              <td>${c.phone}</td>
              <td>${c.address}</td>
              <td>
                <button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick="editCustomer(${c.id}, '${c.name}', '${c.email}', '${c.phone}', '${c.address}')">Edit</button>
                <button class="btn btn-danger" style="padding: 6px 12px; font-size: 12px;" onclick="deleteCustomer(${c.id})">Delete</button>
              </td>
            </tr>`;
          });
        } else {
          rows = `<tr><td colspan="6" style="text-align: center; color: #94a3b8;">No matching customers found.</td></tr>`;
        }
        $('#customer-table-body').html(rows);
      }
    });
  }

  function clearForm() {
    $('#customer-id').val('');
    $('#name').val('');
    $('#email').val('');
    $('#phone').val('');
    $('#address').val('');
  }
</script>

</body>
</html>
